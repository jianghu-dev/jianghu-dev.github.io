(function() {

  var MAX_PX = 4096, MIN_FONT_PX = 12;
  try {
    var CP = HTMLCanvasElement.prototype;
    var BOX = {width: 'clientWidth', height: 'clientHeight'}, D = {};
    Object.keys(BOX).forEach(function(p) {
      D[p] = Object.getOwnPropertyDescriptor(CP, p);
    });
    var tracking = function(el, p) {
      var box = el[BOX[p]];
      return !el.style[p] && box > 0 && box === D[p].get.call(el) &&
          box === el['__lumiLast' + p];

    var MAX = {width: 'maxWidth', height: 'maxHeight'};
    var PAD = {width: ['paddingLeft', 'paddingRight'],

    var avail = function(el, p) {
      var pe = el.parentElement;
      if (!pe) return 0;

      return pe[BOX[p]] - parseFloat(cs[PAD[p][0]]) -
          parseFloat(cs[PAD[p][1]]);
    };
    Object.keys(BOX).forEach(function(p) {
      var d = D[p];
      if (!d || !d.set || !d.get) return;
      Object.defineProperty(CP, p, {
        configurable: true, enumerable: d.enumerable, get: d.get,
        set: function(v) {

          if (n > box && tracking(this, p)) {
            var el = this, pins = {};
            Object.keys(BOX).forEach(function(q) {
              if (tracking(el, q)) pins[q] = avail(el, q) ||
                  el['__lumiBox' + q];
            });
            Object.keys(pins).forEach(function(q) {
              el.style[q] = '100%';
              el.style[MAX[q]] = pins[q] + 'px';
            });

          }

          this['__lumiLast' + p] = n;

/*
 * Luminous runtime stylesheet — injected once into every generated widget's
 * <head> by the C++ widget agent (id="lumi-runtime"). Single Source of Truth
 * for ALL design tokens and pre-baked .lumi-* component classes. The SI prompts
 * (design.md / html_generation.jinja2 / chart.jinja2) must NOT re-declare these
 * tokens or component CSS; they only reference them.
 *
 * Sections:
 *   1. Web fonts (Google Sans Flex + Google Sans Code)
 *   2. Light token :root (from previewer tokens.css, verbatim)
 *   3. Dark token overrides — REMAPPED to :root so canvas/D3 readers of
 *      getComputedStyle(document.documentElement) resolve dark values (D3).
 *   4. Short diagram/chart aliases (bridge legacy --surface / --chart-N names).
 *   5. In-scope pre-baked .lumi-* component classes.
 */

 *    .lumi-* control has a functional CSS glyph dependency on it, and the
 *    icon ban forbids decorative icons (Decision D2).
 * ============================================================ */

/* ============================================================
 * 4. SHORT DIAGRAM / CHART ALIASES
 *    Legacy diagram.md and chart.jinja2 reference short names such as
 *    --surface, --on-surface, --chart-1..10, --primary, --r-full. These MUST
 *    resolve to the canonical --lumi-sys-color--* tokens (which flip in dark
 *    mode) — otherwise every diagram var() falls back to black (historical
 *    mass-regression bug #4). Light-hex fallbacks are a last resort only.
 * ============================================================ */
:root {
  /* surfaces */
  --surface: var(--lumi-sys-color--surface, #fdfcfc);
  --surface-dim: var(--lumi-sys-color--surface-dim, #f2f0f0);
  --surface-bright: var(--lumi-sys-color--surface-bright, #ffffff);
  --surface-container: var(--lumi-sys-color--surface-container, #f2f0f0);
  --surface-container-high: var(--lumi-sys-color--surface-container-high, #e6e6e6);
  --surface-container-lowest: var(--lumi-sys-color--surface, #ffffff);
  --surface-accent: var(--lumi-sys-color--surface-accent, #9dd2ff);
  --surface-translucent: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));
  --surface-glass: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));
  /* foreground */
  --on-surface: var(--lumi-sys-color--on-surface, #000000);
  --on-surface-variant: var(--lumi-sys-color--on-surface-variant, rgba(0, 0, 0, 0.55));
  --on-surface-low: var(--lumi-sys-color--on-surface-low, rgba(0, 0, 0, 0.08));
  /* accents / brand */

  --primary-container: var(--lumi-sys-color--accent-container, #dcf1ff);
  --accent: var(--lumi-sys-color--accent, #9dd2ff);
  --accent-container: var(--lumi-sys-color--accent-container, #dcf1ff);
  --accent-fixed: var(--lumi-sys-color--accent-fixed, #3186ff);

/* ============================================================
 * 5. IN-SCOPE PRE-BAKED COMPONENT CLASSES
 *    Interactive controls + simple display components only (Decision D5).
 *    Complex components (timeline, sequence, stepper, pros-cons, hero, HUD,
 *    hotspot, media grid) are intentionally excluded.
 * ============================================================ */

/* Global font rendering quality + themed surface backdrop.
 * background/color MUST be set here (SSoT) so the widget backdrop follows the
 * light/dark surface token deterministically. Without this, a widget whose
 * model-generated markup forgets `background: var(--surface)` on its root
 * container falls back to the browser-default white body, producing a broken
 * dark mode (light header/chart area behind a dark card). Regression source:
 * batch1 PB-A02 dark. */
html, body {
  background: var(--body-bg, transparent) !important;
  color: var(--on-surface) !important;
  /* Auto-resizing iframe: content grows the frame, never scrolls the document.
   * Model widgets already emit this; declared here as the SSoT default. */
  overflow-y: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  text-rendering: optimizeLegibility;
}

.widget-container {
  width: 100% !important;
  max-width: 100% !important;
  padding-inline: 0 !important;
  box-sizing: border-box;
}

/* ============================================================
 * SCROLLBAR DISCIPLINE (single source of truth)
 *   Long lists/cards flow and let the iframe auto-resize (see the C++
 *   NeutralizeInnerScroll pass, which removes accidental tiny scroll boxes).
 *   For LEGITIMATE overflow that remains (wide tables, code, pan-containers,
 *   large >=240px viewports) render a slim, theme-aware scrollbar.
 *   One token carries the correct light/dark contrast (the auto-flipped
 *   stroke token is too dark on #0f0f0f), referenced once = SSoT.
 * ============================================================ */
:root { --lumi-scrollbar-thumb: rgba(0, 0, 0, 0.20); }
:root[data-theme="dark"], body.dark-mode { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--lumi-scrollbar-thumb) transparent;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: var(--lumi-scrollbar-thumb);
  border-radius: var(--lumi-sys-shape--full, 999px);
}

/* --- Buttons --- */
/* Universal button fallback (element specificity 0,0,1) — beats `* { padding: 0 }`
   author resets (0,0,0) while still yielding to any author class selector (0,1,0). */
button {
  appearance: none;
  -webkit-appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--lumi-sys-spacing--xs, 6px);

<script id="lumi-os-theme-init">
(function() {
  function syncBody() {
    var dt = document.documentElement.getAttribute('data-theme');
    if (document.body && (dt === 'dark' || dt === 'light')) {
      document.body.classList.toggle('dark-mode', dt === 'dark');
    }
  }
  function syncTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    document.documentElement.setAttribute('data-theme', theme);
    syncBody();
  }
  if (typeof MutationObserver === 'function') {
    new MutationObserver(syncBody).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('DOMContentLoaded', syncBody);
  }
  try {
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mq) {
      var cur = document.documentElement.getAttribute('data-theme');
      if (!cur) {
        syncTheme(mq.matches ? 'dark' : 'light');
      } else {
        syncTheme(cur);
      }
      if (mq.addEventListener) {
        mq.addEventListener('change', function(e) {
          syncTheme(e.matches ? 'dark' : 'light');
        });
      }
    }
  } catch (e) {}
  window.addEventListener('message', function(e) {
    if (e.data && (e.data.type === 'set-theme' || e.data.type === 'APPLY_THEME') && e.data.theme) {
      syncTheme(e.data.theme);
    }
  });
})();

  <script>
    // Shared handles
    let canvas, ctx, animationFrameId;

    // State single source of truth
    const state = {
      ph: 6.0,
      dichromateRatio: 0.5,
      chromateRatio: 0.5
    };

    // Particles array for 2D microscopic simulation
    const TOTAL_PARTICLES = 36;
    let particles = [];
    let waveOffset = 0;

    function getCssVar(name) {
      if (!name) return '';
      const clean = name.replace(/^var\(/, '').replace(/\)$/, '').trim();
      return getComputedStyle(document.documentElement).getPropertyValue(clean.startsWith('--') ? clean : '--' + clean).trim();
    }

    // Calculate species fraction based on equilibrium formula
    // Transition centered around pH 5.8
    function calcFractions(ph) {
      const k = 1.8;
      const x = (ph - 5.8) * k;
      const alphaDichromate = 1 / (1 + Math.exp(x));
      const alphaChromate = 1 - alphaDichromate;
      return {
        dichromate: alphaDichromate,
        chromate: alphaChromate
      };
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < TOTAL_PARTICLES; i++) {
        particles.push({
          x: Math.random(),
          y: Math.random(),
          vx: (Math.random() - 0.5) * 0.003,
          vy: (Math.random() - 0.5) * 0.003,
          type: 'dichromate', // 'dichromate' or 'chromate'
          phase: Math.random() * Math.PI * 2
        });
      }
      syncParticleTypes();
    }

    function syncParticleTypes() {
      const targetDichromateCount = Math.round(state.dichromateRatio * TOTAL_PARTICLES);
      let currentDichromateCount = particles.filter(p => p.type === 'dichromate').length;

      if (currentDichromateCount < targetDichromateCount) {
        // Convert chromate to dichromate
        for (let p of particles) {
          if (currentDichromateCount >= targetDichromateCount) break;
          if (p.type === 'chromate') {
            p.type = 'dichromate';
            currentDichromateCount++;
          }
        }
      } else if (currentDichromateCount > targetDichromateCount) {
        // Convert dichromate to chromate
        for (let p of particles) {
          if (currentDichromateCount <= targetDichromateCount) break;
          if (p.type === 'dichromate') {
            p.type = 'chromate';
            currentDichromateCount--;
          }
        }
      }
    }

    function renderHeaderUI() {
      const pDichromate = (state.dichromateRatio * 100).toFixed(1);
      const pChromate = (state.chromateRatio * 100).toFixed(1);

      const labelDi = document.getElementById('label-dichromate');
      const labelCh = document.getElementById('label-chromate');
      const barDi = document.getElementById('bar-dichromate');
      const barCh = document.getElementById('bar-chromate');

      if (labelDi) labelDi.textContent = `Cr₂O₇²⁻ (橙): ${pDichromate}%`;
      if (labelCh) labelCh.textContent = `CrO₄²⁻ (黄): ${pChromate}%`;
      if (barDi) barDi.style.width = `${pDichromate}%`;
      if (barCh) barCh.style.width = `${pChromate}%`;

      // Equation highlighting
      const elChromate = document.getElementById('part-chromate');
      const elProton = document.getElementById('part-proton');
      const elDichromate = document.getElementById('part-dichromate');

      if (elChromate && elProton && elDichromate) {
        elChromate.classList.remove('active-yellow');
        elDichromate.classList.remove('active-orange');
        elProton.classList.remove('active-orange');

        if (state.ph > 7.5) {
          elChromate.classList.add('active-yellow');
        } else if (state.ph < 4.5) {
          elDichromate.classList.add('active-orange');
          elProton.classList.add('active-orange');
        }
      }

      // Sync preset buttons state
      document.querySelectorAll('.preset-btn-group .lumi-chip').forEach(btn => {
        const bPh = parseFloat(btn.dataset.ph);
        if (Math.abs(bPh - state.ph) < 0.2) {
          btn.classList.add('is-active');
        } else {
          btn.classList.remove('is-active');
        }
      });
    }

    function updateViz() {
      try {
        const fracs = calcFractions(state.ph);
        state.dichromateRatio = fracs.dichromate;
        state.chromateRatio = fracs.chromate;

        syncParticleTypes();
        renderHeaderUI();
      } catch (err) {
        showErrorFallback('eq-card-zone', err);
      }
    }

    function drawSimulation() {
      if (!canvas || !ctx) return;

      const viewport = canvas.parentElement;
      const width = viewport.clientWidth || 500;
      const height = viewport.clientHeight || 260;

      const dpr = window.devicePixelRatio || 1;
      if (canvas.width !== Math.floor(width * dpr) || canvas.height !== Math.floor(height * dpr)) {
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      ctx.clearRect(0, 0, width, height);

      // Beaker dimensions
      const beakerW = Math.min(width * 0.55, 260);
      const beakerH = height * 0.78;
      const beakerX = (width - beakerW) / 2;
      const beakerY = height * 0.15;
      const liquidLevel = beakerY + beakerH * 0.25;

      // Color calculations
      // Dichromate Orange: rgb(255, 102, 0)
      // Chromate Yellow: rgb(255, 215, 0)
      const r = 255;
      const g = Math.round(102 * state.dichromateRatio + 215 * state.chromateRatio);
      const b = 0;
      const liquidColor = `rgba(${r}, ${g}, ${b}, 0.72)`;
      const liquidSurfaceColor = `rgba(${r}, ${Math.min(255, g + 30)}, 40, 0.9)`;

      // Draw Beaker Liquid Body
      ctx.save();
      
      // Liquid clipping region inside beaker
      ctx.beginPath();
      const radius = 12;
      ctx.moveTo(beakerX + 6, liquidLevel);
      
      // Wave surface
      waveOffset += 0.03;
      for (let x = beakerX + 6; x <= beakerX + beakerW - 6; x += 5) {
        const waveY = liquidLevel + Math.sin((x - beakerX) * 0.04 + waveOffset) * 2.5;
        ctx.lineTo(x, waveY);
      }
      
      ctx.lineTo(beakerX + beakerW - 6, beakerY + beakerH - radius);
      ctx.quadraticCurveTo(beakerX + beakerW - 6, beakerY + beakerH, beakerX + beakerW - 6 - radius, beakerY + beakerH);
      ctx.lineTo(beakerX + 6 + radius, beakerY + beakerH);
      ctx.quadraticCurveTo(beakerX + 6, beakerY + beakerH, beakerX + 6, beakerY + beakerH - radius);
      ctx.closePath();

      // Liquid Gradient Fill
      const grad = ctx.createLinearGradient(0, liquidLevel, 0, beakerY + beakerH);
      grad.addColorStop(0, liquidSurfaceColor);
      grad.addColorStop(1, liquidColor);
      ctx.fillStyle = grad;
      ctx.fill();

      // Render Microscopic Particles inside liquid
      const pad = 24;
      const pMinX = beakerX + pad;
      const pMaxX = beakerX + beakerW - pad;
      const pMinY = liquidLevel + pad;
      const pMaxY = beakerY + beakerH - pad;

      for (let p of particles) {
        // Move particle
        p.x += p.vx;
        p.y += p.vy;
        p.phase += 0.02;

        if (p.x < 0) { p.x = 0; p.vx *= -1; }
        if (p.x > 1) { p.x = 1; p.vx *= -1; }
        if (p.y < 0) { p.y = 0; p.vy *= -1; }
        if (p.y > 1) { p.y = 1; p.vy *= -1; }

        const px = pMinX + p.x * (pMaxX - pMinX);
        const py = pMinY + p.y * (pMaxY - pMinY) + Math.sin(p.phase) * 1.5;

        if (p.type === 'dichromate') {
          // Cr2O7(2-) : Twin Orange spheres connected
          const angle = p.phase;
          const dist = 7;
          const x1 = px - Math.cos(angle) * dist;
          const y1 = py - Math.sin(angle) * dist;
          const x2 = px + Math.cos(angle) * dist;
          const y2 = py + Math.sin(angle) * dist;

          // Connection bond
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = "rgba(200, 50, 0, 0.8)";
          ctx.lineWidth = 3;
          ctx.stroke();

          // Two orange spheres
          ctx.beginPath();
          ctx.arc(x1, y1, 5.5, 0, Math.PI * 2);
          ctx.arc(x2, y2, 5.5, 0, Math.PI * 2);
          ctx.fillStyle = "#ff4500";
          ctx.fill();
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 1;
          ctx.stroke();
        } else {
          // CrO4(2-) : Single Bright Yellow sphere
          ctx.beginPath();
          ctx.arc(px, py, 6.5, 0, Math.PI * 2);
          ctx.fillStyle = "#ffd700";
          ctx.fill();
          ctx.strokeStyle = "#b38600";
          ctx.lineWidth = 1.2;
          ctx.stroke();

          // Center glow dot
          ctx.beginPath();
          ctx.arc(px - 1.5, py - 1.5, 2, 0, Math.PI * 2);
          ctx.fillStyle = "#ffffff";
          ctx.fill();
        }
      }

      // Draw H+ Protons floating if acidic (pH < 5)
      if (state.ph < 5.5) {
        const protonCount = Math.round((5.5 - state.ph) * 3);
        ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        for (let i = 0; i < protonCount; i++) {
          const hx = pMinX + ((Math.sin(i * 37 + waveOffset) + 1) / 2) * (pMaxX - pMinX);
          const hy = pMinY + ((Math.cos(i * 19 + waveOffset * 0.8) + 1) / 2) * (pMaxY - pMinY);
          ctx.beginPath();
          ctx.arc(hx, hy, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.restore();

      // Draw Glass Beaker Outline & Measurement Lines
      ctx.save();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = getCssVar('--outline') || '#727676';
      ctx.lineCap = 'round';

      // Spout & Lip
      ctx.beginPath();
      ctx.moveTo(beakerX - 8, beakerY);
      ctx.lineTo(beakerX + 6, beakerY);
      ctx.lineTo(beakerX + 6, beakerY + beakerH - radius);
      ctx.quadraticCurveTo(beakerX + 6, beakerY + beakerH, beakerX + 6 + radius, beakerY + beakerH);
      ctx.lineTo(beakerX + beakerW - 6 - radius, beakerY + beakerH);
      ctx.quadraticCurveTo(beakerX + beakerW - 6, beakerY + beakerH, beakerX + beakerW - 6, beakerY + beakerH - radius);
      ctx.lineTo(beakerX + beakerW - 6, beakerY);
      ctx.lineTo(beakerX + beakerW + 4, beakerY);
      ctx.stroke();

      // Graduation ticks (Measurement marks)
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = getCssVar('--on-surface-variant') || 'rgba(0,0,0,0.4)';
      ctx.fillStyle = getCssVar('--on-surface-variant') || 'rgba(0,0,0,0.55)';
      ctx.font = "10px var(--ff-mono, monospace)";
      
      const ticks = ['100ml', '200ml', '300ml', '400ml'];
      ticks.forEach((label, idx) => {
        const ty = beakerY + beakerH - (idx + 1) * (beakerH * 0.18);
        ctx.beginPath();
        ctx.moveTo(beakerX + 8, ty);
        ctx.lineTo(beakerX + 20, ty);
        ctx.stroke();
        ctx.fillText(label, beakerX + 24, ty + 3);
      });

      // Beaker Title Overlay Badge
      ctx.fillStyle = getCssVar('--surface-bright') || '#ffffff';
      ctx.beginPath();
      const badgeW = 96, badgeH = 22;
      const badgeX = beakerX + beakerW - badgeW - 12;
      const badgeY = beakerY + 12;
      ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 6);
      ctx.fill();
      ctx.strokeStyle = getCssVar('--stroke-default') || '#e3e3e3';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = getCssVar('--on-surface') || '#000000';
      ctx.font = "11px var(--ff-sans, sans-serif)";
      ctx.textAlign = "center";
      ctx.fillText(`pH = ${state.ph.toFixed(1)}`, badgeX + badgeW / 2, badgeY + 15);

      ctx.restore();

      animationFrameId = requestAnimationFrame(drawSimulation);
    }

    function showErrorFallback(containerId, error) {
      console.error(`Render error in ${containerId}:`, error);
      const container = document.getElementById(containerId);
      if (container) {
        if (container) container.innerHTML = `
          <div class="error-fallback-card" style="padding: var(--lumi-sys-spacing--l, 16px); background: var(--surface-dim); border-radius: var(--r-m, 12px); text-align: center; color: var(--on-surface-variant);">
            <p style="margin: 0;" class="lumi-body-m">数据渲染异常</p>
            <p style="margin: 4px 0 0 0;" class="lumi-body-s">无法正常加载化学平衡仿真模块。</p>
          </div>`;
      }
    }

    // Initialize Widget
    function init() {
      canvas = document.getElementById('simCanvas');
      if (canvas) {
        ctx = canvas.getContext('2d');
      }

      initParticles();

      // Bind Slider Controls
      const slider = document.getElementById('ph-slider');
      if (slider) {
        slider.addEventListener('input', (e) => {
          const val = parseFloat(e.target.value);
          state.ph = val;

          const pct = (val - slider.min) / (slider.max - slider.min) * 100;
          slider.style.setProperty('--progress', pct + '%');

          const valBadge = document.getElementById('ph-slider-val');
          if (valBadge) valBadge.textContent = val.toFixed(1);

          updateViz();
        });
      }

      // Bind Preset Buttons
      document.querySelectorAll('.preset-btn-group .lumi-chip').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const targetPh = parseFloat(e.currentTarget.dataset.ph);
          state.ph = targetPh;

          if (slider) {
            slider.value = targetPh;
            const pct = (targetPh - slider.min) / (slider.max - slider.min) * 100;
            slider.style.setProperty('--progress', pct + '%');
            const valBadge = document.getElementById('ph-slider-val');
            if (valBadge) valBadge.textContent = targetPh.toFixed(1);
          }

          updateViz();
        });
      });

      // Render First Frame
      updateViz();

      // Start Simulation Loop
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animationFrameId = requestAnimationFrame(drawSimulation);
    }

    // Direct invocation
    init();

    // Host Context & Theme Adaptation + Auto Resize
    const applyTheme = t => {
      document.documentElement.setAttribute('data-theme', t);
      if (typeof updateViz === 'function') updateViz();
    };

    if (!document.documentElement.hasAttribute('data-theme') && window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
      applyTheme('dark');
    }

    window.addEventListener('message', e => {
      if (e.data?.type === 'set-theme' || e.data?.type === 'APPLY_THEME') {
        applyTheme(e.data.theme);
      }
    });

    (function autoResize() {
      function notifyHeight() {
        const c = document.querySelector('.widget-container') || document.body;
        if (!c) return;
        const h = Math.ceil(Math.max(c.getBoundingClientRect().bottom, c.scrollHeight));
        window.parent.postMessage({type: 'widget-resize', height: h}, '*');
      }
      window.addEventListener('load', () => setTimeout(notifyHeight, 120));
      new ResizeObserver(() => notifyHeight()).observe(document.querySelector('.widget-container') || document.body);
    })();
  </script>
